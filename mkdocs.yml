site_name: Maple's blog
site_url: https://maple-pwn.github.io/
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: false
theme:
  name: material
  language: zh
  logo: images/logo.svg
  favicon: images/logo.svg
  custom_dir: overrides
  features:
  - content.code.copy
  - content.code.select
  - content.code.annotate
  - navigation.titles
  - navigation.tabs
  - navigation.indexes
  - navigation.top
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/weather-sunny
      name: 切换到深色模式
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/weather-night
      name: 切换到浅色模式
markdown_extensions:
- tables
- attr_list
- md_in_html
- pymdownx.arithmatex:
    generic: true
extra_css:
- resources/css/extra.css
- resources/css/tittle.css
- resources/css/read-metrics.css
- resources/css/leftsidebar.css
- https://static.zeoseven.com/zsft/292/main/result.css
extra_javascript:
- resources/js/mathjax-config.js
- https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
- resources/js/read-metrics.js
- resources/js/sidebar-resize.js
plugins: []
