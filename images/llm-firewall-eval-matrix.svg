<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <rect width="1280" height="760" fill="#fbfbf8"/>
  <text x="60" y="62" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2b37">Evaluation Matrix for an LLM Firewall</text>
  <text x="60" y="96" font-family="Arial, sans-serif" font-size="18" fill="#55626d">A useful benchmark must balance security, utility, performance, and operational cost.</text>

  <rect x="80" y="150" width="1120" height="500" rx="18" fill="#ffffff" stroke="#cfd7de" stroke-width="2"/>

  <rect x="80" y="150" width="220" height="90" fill="#ecf2f8"/>
  <text x="190" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#22384d">Layer</text>

  <rect x="300" y="150" width="220" height="90" fill="#ecf2f8"/>
  <text x="410" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#22384d">Security</text>

  <rect x="520" y="150" width="220" height="90" fill="#ecf2f8"/>
  <text x="630" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#22384d">Utility</text>

  <rect x="740" y="150" width="220" height="90" fill="#ecf2f8"/>
  <text x="850" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#22384d">Performance</text>

  <rect x="960" y="150" width="240" height="90" fill="#ecf2f8"/>
  <text x="1080" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#22384d">Operations</text>

  <g font-family="Arial, sans-serif" font-size="21" fill="#22384d">
    <rect x="80" y="240" width="220" height="82" fill="#f9fbfd"/>
    <text x="190" y="290" text-anchor="middle">Input</text>
    <rect x="300" y="240" width="220" height="82" fill="#e7f6ec"/>
    <text x="410" y="290" text-anchor="middle">ASR / FPR</text>
    <rect x="520" y="240" width="220" height="82" fill="#fff8dc"/>
    <text x="630" y="290" text-anchor="middle">normal task pass rate</text>
    <rect x="740" y="240" width="220" height="82" fill="#eef3fb"/>
    <text x="850" y="290" text-anchor="middle">latency</text>
    <rect x="960" y="240" width="240" height="82" fill="#fbeef4"/>
    <text x="1080" y="290" text-anchor="middle">policy tuning cost</text>

    <rect x="80" y="322" width="220" height="82" fill="#f9fbfd"/>
    <text x="190" y="372" text-anchor="middle">Context / RAG</text>
    <rect x="300" y="322" width="220" height="82" fill="#e7f6ec"/>
    <text x="410" y="372" text-anchor="middle">poison detection</text>
    <rect x="520" y="322" width="220" height="82" fill="#fff8dc"/>
    <text x="630" y="372" text-anchor="middle">answer quality drift</text>
    <rect x="740" y="322" width="220" height="82" fill="#eef3fb"/>
    <text x="850" y="372" text-anchor="middle">throughput</text>
    <rect x="960" y="322" width="240" height="82" fill="#fbeef4"/>
    <text x="1080" y="372" text-anchor="middle">data maintenance</text>

    <rect x="80" y="404" width="220" height="82" fill="#f9fbfd"/>
    <text x="190" y="454" text-anchor="middle">Tool Runtime</text>
    <rect x="300" y="404" width="220" height="82" fill="#e7f6ec"/>
    <text x="410" y="454" text-anchor="middle">blocked misuse</text>
    <rect x="520" y="404" width="220" height="82" fill="#fff8dc"/>
    <text x="630" y="454" text-anchor="middle">task completion</text>
    <rect x="740" y="404" width="220" height="82" fill="#eef3fb"/>
    <text x="850" y="454" text-anchor="middle">sync overhead</text>
    <rect x="960" y="404" width="240" height="82" fill="#fbeef4"/>
    <text x="1080" y="454" text-anchor="middle">approval workflow</text>

    <rect x="80" y="486" width="220" height="82" fill="#f9fbfd"/>
    <text x="190" y="536" text-anchor="middle">Output</text>
    <rect x="300" y="486" width="220" height="82" fill="#e7f6ec"/>
    <text x="410" y="536" text-anchor="middle">leak / harm catch rate</text>
    <rect x="520" y="486" width="220" height="82" fill="#fff8dc"/>
    <text x="630" y="536" text-anchor="middle">overblocking rate</text>
    <rect x="740" y="486" width="220" height="82" fill="#eef3fb"/>
    <text x="850" y="536" text-anchor="middle">stream delay</text>
    <rect x="960" y="486" width="240" height="82" fill="#fbeef4"/>
    <text x="1080" y="536" text-anchor="middle">explainability</text>

    <rect x="80" y="568" width="220" height="82" fill="#f9fbfd"/>
    <text x="190" y="618" text-anchor="middle">Operations</text>
    <rect x="300" y="568" width="220" height="82" fill="#e7f6ec"/>
    <text x="410" y="618" text-anchor="middle">adaptive robustness</text>
    <rect x="520" y="568" width="220" height="82" fill="#fff8dc"/>
    <text x="630" y="618" text-anchor="middle">team productivity</text>
    <rect x="740" y="568" width="220" height="82" fill="#eef3fb"/>
    <text x="850" y="618" text-anchor="middle">cost per request</text>
    <rect x="960" y="568" width="240" height="82" fill="#fbeef4"/>
    <text x="1080" y="618" text-anchor="middle">update / rollback ease</text>
  </g>

  <text x="60" y="722" font-family="Arial, sans-serif" font-size="17" fill="#59656f">Author-drawn summary aligned with AgentDojo, ASB, BIPIA, promptfoo, and garak evaluation themes.</text>
</svg>
