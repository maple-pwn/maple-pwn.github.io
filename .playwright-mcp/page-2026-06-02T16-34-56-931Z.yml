              - text: 控制着算法每一轮迭代中的更新步长，若太大则容易振荡，太小则收敛速度过慢。
          - paragraph [ref=e4252]: 核心算法如下：
          - paragraph [ref=e4253]:
            - img "image-20260210212600173" [ref=e4254]
          - blockquote [ref=e4255]:
            - paragraph [ref=e4256]: 简单来说就是：输入示例提供给输入层神经元，然后信号直到传递到输出层，然后计算出输出层的误差逆向传播至隐层神经元，最后根据隐层神经元的误差来对连接权和阈值进行调整
          - heading "全局最小与局部极小" [level=3] [ref=e4257]
          - paragraph [ref=e4258]: 这一部分主要是介绍了梯度下降的相关内容，没有涉及计算，三种“跳出”局部极小接近全局最小的方法：
          - list [ref=e4259]:
            - listitem [ref=e4260]: 随机梯度下降：在梯度计算中引入随机扰动
            - listitem [ref=e4261]: “模拟退火”技术，即可以接受“次优解”
            - listitem [ref=e4262]: 多次随机初始化：用不同的初始权值和阈值多次训练
          - heading "深度学习" [level=3] [ref=e4263]
          - paragraph [ref=e4264]: 随着计算能力的升级，以“深度学习”为代表的复杂模型开始受到人们的关注。而典型的深度学习模型就是很深层的神经网络。
          - paragraph [ref=e4265]: 隐层多了，相应的神经元连接权、阈值等参数就会更多。模型复杂度页可通过单纯增加隐层神经元的数目更加有效，因为增加隐层数不仅增加了拥有激活函数的神经元数目，还增加了激活函数嵌套的层数。
          - paragraph [ref=e4266]: 然而，多隐层神经网络难以直接用经典算法进行训练，因为误差在多隐层内逆传播时，往往会发散而不能收敛到稳定状态
          - paragraph [ref=e4267]:
            - text: 于是提出了
            - strong [ref=e4268]: 无监督逐层训练
            - text: 作为多隐层网络训练的有效手段
          - generic [ref=e4269]:
            - paragraph [ref=e4270]: Note
            - paragraph [ref=e4271]:
              - text: 无监督逐层训练的主要思想是：每次训练一层隐节点，训练时将上一层隐节点的输出作为输入，而本层隐节点的输出作为下一层隐节点的输入，这称为
              - strong [ref=e4272]: 预训练
          - paragraph [ref=e4273]:
            - text: 在预训练全部完成后，对整个网络进行
            - strong [ref=e4274]: 微调训练
          - paragraph [ref=e4275]: 实际上，”预训练+微调“的做法可以视为将大量参数分组，对每组先找到局部看起来比较好的设置，然后再基于这些局部较优的结果联合起来进行全局寻优
          - paragraph [ref=e4276]:
            - text: 另一种节省训练开销的策略是
            - strong [ref=e4277]: 权共享
            - text: ，即让一组神经元使用相同的连接权，在卷积神经网络(CNN)中用处发挥重大作用，如下，CNN符合多个“卷积层”和“采样层”对输入信号进行加工，然后在连接层实现与输出目标之间的映射
          - paragraph [ref=e4278]:
            - img "image-20260210221024649" [ref=e4279]
          - generic [ref=e4280]:
            - paragraph [ref=e4281]: Tip
            - paragraph [ref=e4282]: 从另一个角度来理解深度学习的话，很多算法均采用隐层堆叠、每层对上一层的输出进行处理的机制
          - paragraph [ref=e4283]: 可以看作是在对输入信号进行逐层加工，从而把初始的、与输出目标之间联系不太密切的输入表示，转化成与输出目标联系更加密切的表示、使得原来仅基于最后一层输出映射难以完成的任务成为可能
          - paragraph [ref=e4284]: 换句话说：通过多层处理，将初始的“低层”特征表示转化为“高层”特征表示后，用“简单模型”完成复杂的分类等学习任务
