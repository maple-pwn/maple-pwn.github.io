            - button "复制" [ref=e5880] [cursor=pointer]
            - code [ref=e5881]: "import numpy as np def pca(X, d_out=None, var_ratio=None): \"\"\" PCA（主成分分析） 输入: X: (m, d) numpy数组，m个样本、d维特征（行=样本） d_out: 目标降到的维度 d'（二选一；优先使用d_out） var_ratio: 解释方差阈值t（如0.95），自动选最小d' 输出: Z: (m, d') 降维后的表示（投影坐标） W: (d, d') 投影矩阵（列为主成分方向） mu: (d,) 均值向量（用于对新样本做同样中心化） eigvals: (d,) 按降序排列的特征值（方差大小） \"\"\" X = np.asarray(X, dtype=float) m, d = X.shape # 1) 中心化 mu = X.mean(axis=0) Xc = X - mu # 2) 协方差矩阵（对称） C = (Xc.T @ Xc) / max(m - 1, 1) # 3) 特征分解（对称矩阵用eigh更稳） eigvals, eigvecs = np.linalg.eigh(C) # 升序 idx = np.argsort(eigvals)[::-1] # 改为降序 eigvals, eigvecs = eigvals[idx], eigvecs[:, idx] # eigvecs列对应特征值 # 4) 选择降维维度 d' if d_out is None: if var_ratio is None: d_out = d # 不指定则不降维 else: total = eigvals.sum() if total <= 0: d_out = 1 else: cum = np.cumsum(eigvals) / total d_out = int(np.searchsorted(cum, var_ratio) + 1) d_out = int(np.clip(d_out, 1, d)) # 5) 投影：W为前d'个主成分，Z为低维坐标 W = eigvecs[:, :d_out] Z = Xc @ W return Z, W, mu, eigvals # ====== demo ====== if __name__ == \"__main__\": X = np.array([[2, 0], [0, 1], [3, 1], [4, 2]], dtype=float) Z, W, mu, eigvals = pca(X, d_out=1) # 降到1维 print(\"Z=\\n\", Z) print(\"W=\\n\", W) print(\"mu=\", mu) print(\"eigvals=\", eigvals)"
