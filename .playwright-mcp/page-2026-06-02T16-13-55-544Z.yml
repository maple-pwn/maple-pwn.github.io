              - text: （相当于学一个嵌入空间）；在这个空间里，soft-kNN 的 LOO 正确率最大（损失最小）；这就是“把距离学习和分类性能绑定”的典型做法：不是在抽象地学几何，而是在为 kNN 的准确率服务。
          - generic [ref=e10302]:
            - button "复制" [ref=e10303] [cursor=pointer]
            - code [ref=e10304]: "import numpy as np # ========================= # 10.6 度量学习：NCA + 约束式(类似Xing) 的最小可用实现 # ========================= def _pairwise_sqdist(A, B): \"\"\"返回 (n,m) 的平方欧氏距离矩阵 ||A_i - B_j||^2\"\"\" A2 = np.sum(A*A, axis=1, keepdims=True) B2 = np.sum(B*B, axis=1, keepdims=True).T D2 = A2 + B2 - 2.0 * (A @ B.T) return np.maximum(D2, 0.0) def _softmax_rows(S): \"\"\"对每行做 softmax（数值稳定）\"\"\" S = S - np.max(S, axis=1, keepdims=True) E = np.exp(S) return E / (np.sum(E, axis=1, keepdims=True) + 1e-12) # ========================================================== # (A) NCA：对应教材(10.35)-(10.38)，学习 P，使 soft-kNN 的 LOO 正确率最大 # ========================================================== def nca_fit(X, y, d_out=2, lr=1e-2, epochs=200, reg=1e-4, seed=0): \"\"\" NCA 训练（学习线性变换 P，M = P P^T） 输入: X: (m,d) 样本矩阵（行=样本） y: (m,) 0..C-1 类别标签 d_out: 低维维度 d'（P 的输出维） lr: 学习率 epochs: 迭代轮数 reg: L2 正则（防止发散） 输出: P: (d,d') 线性变换矩阵；距离为 ||P^T x_i - P^T x_j||^2 history: 每轮目标值列表（越小越好） \"\"\" X = np.asarray(X, float) y = np.asarray(y) m, d = X.shape rng = np.random.default_rng(seed) P = 0.01 * rng.standard_normal((d, d_out)) # 同类掩码：same[i,j]=True 表示 y_i==y_j，训练中用于(10.36) same = (y[:, None] == y[None, :]).astype(float) np.fill_diagonal(same, 0.0) # 留一法：不让自己投票 history = [] for _ in range(epochs): Z = X @ P # (m,d') D2 = _pairwise_sqdist(Z, Z) # (m,m) 低维平方距离 np.fill_diagonal(D2, np.inf) # 排除自己（更接近LOO） # (10.35) p_ij = softmax( -||zi-zj||^2 ) Pij = _softmax_rows(-D2) # (10.36) p_i = sum_{j in same class} p_ij pi = np.sum(Pij * same, axis=1) # (m,) loss = 1.0 - np.mean(pi) + reg * np.sum(P * P) # (10.38) 的平均版 + 正则 history.append(loss) # --------- 下面是对 P 的梯度（一个紧凑可用的推导实现）--------- # 记 A_ij = Pij_ij，S_ij = same_ij A = Pij S = same # 对每个 i，构造权重矩阵 Wi: # Wi[j] = A_ij * (pi_i - S_ij) # 这是 NCA 常见梯度形式的核心权重 pi_col = pi[:, None] # (m,1) W = A * (pi_col - S) # (m,m) # 梯度：dL/dP = 2 X^T (G) ，其中 # G_i = sum_j W_ij (z_i - z_j) （按 i 聚合） # 用矩阵方式实现：G = diag(row_sum(W)) Z - W Z row_sum = np.sum(W, axis=1) # (m,) G = (row_sum[:, None] * Z) - (W @ Z) # (m,d') grad = 2.0 * (X.T @ G) / m + 2.0 * reg * P # (d,d') P -= lr * grad return P, history def nca_transform(X, P): \"\"\"用学到的 P 做嵌入：Z = X P\"\"\" return np.asarray(X, float) @ P # ========================= # 用法示例（可删） # ========================= if __name__ == \"__main__\": rng = np.random.default_rng(0) X = rng.normal(size=(100, 10)) y = rng.integers(0, 3, size=100) # NCA P, hist = nca_fit(X, y, d_out=2, lr=0.05, epochs=100) Z = nca_transform(X, P) print(\"NCA:\", Z.shape, \"last loss:\", hist[-1])"
