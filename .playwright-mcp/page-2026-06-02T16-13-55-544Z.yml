            - button "复制" [ref=e4238] [cursor=pointer]
            - code [ref=e4239]: "import numpy as np def classical_mds(D, d_prime=2, eps=1e-12): \"\"\" 经典 MDS（Classical MDS） 输入: D: (m, m) 距离矩阵，D[i, j] = dist(x_i, x_j)，要求对称、对角为0 d_prime: 目标降维维度 d' eps: 数值稳定用的小阈值 输出: Z: (m, d') 低维坐标矩阵，每一行是一个样本在低维空间的坐标 eigvals: 选取的前 d' 个特征值（从大到小） \"\"\" D = np.asarray(D, dtype=float) m = D.shape[0] assert D.shape == (m, m), \"D 必须是方阵 (m, m)\" # 1) 距离平方矩阵：D2[i,j] = dist_ij^2 D2 = D ** 2 # 2) 双中心化（对应教材(10.10)的效果） # B = -1/2 * J * D2 * J # 其中 J = I - (1/m) * 11^T 是中心化矩阵 I = np.eye(m) one = np.ones((m, 1)) J = I - (one @ one.T) / m B = -0.5 * J @ D2 @ J # 3) B 是对称矩阵，用 eigh（专门处理对称/厄米矩阵）更稳 # eigvals 升序，eigvecs 列为特征向量 eigvals, eigvecs = np.linalg.eigh(B) # 4) 按特征值从大到小排序 idx = np.argsort(eigvals)[::-1] eigvals = eigvals[idx] eigvecs = eigvecs[:, idx] # 5) 取前 d' 个“非负”特征值（理论上 B 半正定；数值误差可能出现微小负数） # Z = V_{d'} * sqrt(Lambda_{d'})，输出 shape (m, d') eigvals_top = eigvals[:d_prime] eigvecs_top = eigvecs[:, :d_prime] # 将小于 0 的特征值截断为 0（避免 sqrt 出现 nan） eigvals_top_clipped = np.maximum(eigvals_top, 0.0) # 低维坐标：每列缩放对应特征向量 Z = eigvecs_top * np.sqrt(eigvals_top_clipped + eps) return Z, eigvals_top # ========== 示例 ========== if __name__ == \"__main__\": # 构造 4 个点的距离矩阵（例子随便写的） D = np.array([ [0, 1, 2, 2], [1, 0, 1, 2], [2, 1, 0, 1], [2, 2, 1, 0], ], dtype=float) Z, lam = classical_mds(D, d_prime=2) print(\"前两个特征值:\", lam) print(\"二维坐标 Z:\\n\", Z)"
