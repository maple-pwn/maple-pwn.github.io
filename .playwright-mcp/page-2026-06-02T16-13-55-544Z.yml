          - generic [ref=e7186]:
            - button "复制" [ref=e7187] [cursor=pointer]
            - code [ref=e7188]: "import numpy as np # 之前的MDS def classical_mds(D, d_prime=2, eps=1e-12): \"\"\" 经典 MDS（Classical MDS） 输入: D: (m, m) 距离矩阵，D[i, j] = dist(x_i, x_j)，要求对称、对角为0 d_prime: 目标降维维度 d' eps: 数值稳定用的小阈值 输出: Z: (m, d') 低维坐标矩阵，每一行是一个样本在低维空间的坐标 eigvals: 选取的前 d' 个特征值（从大到小） \"\"\" D = np.asarray(D, dtype=float) m = D.shape[0] assert D.shape == (m, m), \"D 必须是方阵 (m, m)\" D2 = D ** 2 I = np.eye(m) one = np.ones((m, 1)) J = I - (one @ one.T) / m B = -0.5 * J @ D2 @ J eigvals, eigvecs = np.linalg.eigh(B) idx = np.argsort(eigvals)[::-1] eigvals = eigvals[idx] eigvecs = eigvecs[:, idx] eigvals_top = eigvals[:d_prime] eigvecs_top = eigvecs[:, :d_prime] eigvals_top_clipped = np.maximum(eigvals_top, 0.0) Z = eigvecs_top * np.sqrt(eigvals_top_clipped + eps) return Z, eigvals_top # ========================= # 工具：两两欧氏距离矩阵 # ========================= def pairwise_dist(X): \"\"\"输入 X:(m,d)，输出 D:(m,m) 欧氏距离矩阵\"\"\" X = np.asarray(X, dtype=float) G = X @ X.T sq = np.diag(G) D2 = sq[:, None] + sq[None, :] - 2.0 * G D2 = np.maximum(D2, 0.0) return np.sqrt(D2) def isomap(X, k=10, d_prime=2): \"\"\" Isomap 输入: X: (m,d) 样本矩阵 k: 近邻数 d_prime: 目标维度 输出: Z: (m,d') 低维坐标（用 MDS 得到） D_geo: (m,m) 近似测地线距离（图最短路距离） \"\"\" X = np.asarray(X, dtype=float) m = X.shape[0] D = pairwise_dist(X) # 1) 构造 kNN 图的邻接矩阵（非邻居设为 inf） G = np.full((m, m), np.inf) np.fill_diagonal(G, 0.0) for i in range(m): nn = np.argsort(D[i])[1:k+1] # 排除自己 G[i, nn] = D[i, nn] # 无向化（常见做法：取 min） G = np.minimum(G, G.T) # 2) Floyd-Warshall 求所有点对最短路（测地线近似） D_geo = G.copy() for t in range(m): # 利用广播加速：D[i,j] = min(D[i,j], D[i,t]+D[t,j]) D_geo = np.minimum(D_geo, D_geo[:, [t]] + D_geo[[t], :]) # 3) 用 MDS 将测地线距离嵌入到低维 Z, _ = classical_mds(D_geo, d_prime=d_prime) return Z, D_geo # ========================= # 简短用法示例 # ========================= if __name__ == \"__main__\": rng = np.random.default_rng(0) X = rng.normal(size=(200, 5)) Z_iso, D_geo = isomap(X, k=10, d_prime=2) print( Z_iso.shape)"
