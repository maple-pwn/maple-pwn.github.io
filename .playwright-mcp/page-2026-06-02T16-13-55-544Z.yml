          - generic [ref=e8504]:
            - button "复制" [ref=e8505] [cursor=pointer]
            - code [ref=e8506]: "import numpy as np # ========================= # 工具：两两欧氏距离矩阵 # ========================= def pairwise_dist(X): \"\"\"输入 X:(m,d)，输出 D:(m,m) 欧氏距离矩阵\"\"\" X = np.asarray(X, dtype=float) G = X @ X.T sq = np.diag(G) D2 = sq[:, None] + sq[None, :] - 2.0 * G D2 = np.maximum(D2, 0.0) return np.sqrt(D2) def lle(X, k=10, d_prime=2, reg=1e-3, eps=1e-12): \"\"\" LLE（Locally Linear Embedding） 输入: X: (m,d) 样本矩阵 k: 近邻数 d_prime: 目标维度 reg: 求逆稳定项（对局部协方差加 reg*trace） 输出: Z: (m,d') 低维坐标（每行一个样本） W: (m,m) 权重矩阵（W[i,j]=w_ij；非邻居为0） \"\"\" X = np.asarray(X, dtype=float) m, d = X.shape D = pairwise_dist(X) # 1) 找近邻并求权重（对应(10.27)(10.28)） W = np.zeros((m, m), dtype=float) for i in range(m): nn = np.argsort(D[i])[1:k+1] Xi = X[i] Xn = X[nn] # (k,d) Zloc = Xn - Xi # (k,d) # 局部Gram矩阵 C = (x_i-x_j)^T (x_i-x_k) = Zloc Zloc^T C = Zloc @ Zloc.T # (k,k) # 正则化：避免奇异（reg * trace(C)） tr = np.trace(C) C = C + np.eye(k) * (reg * (tr if tr > eps else 1.0)) # 解 C w = 1，然后归一化使 sum(w)=1 ones = np.ones(k) w = np.linalg.solve(C, ones) w = w / (w.sum() + eps) W[i, nn] = w # 2) 构造 M = (I-W)^T(I-W)（对应(10.30)） I = np.eye(m) M = (I - W).T @ (I - W) # 3) 解最小特征值对应的特征向量（对应(10.31)） eigvals, eigvecs = np.linalg.eigh(M) # 升序 # 跳过最小的一个（理论上为0，对应平移不变的常数向量） Z = eigvecs[:, 1:d_prime+1] return Z, W if __name__ == \"__main__\": rng = np.random.default_rng(0) X = rng.normal(size=(200, 5)) Z_lle, W = lle(X, k=10, d_prime=2) print(Z_lle.shape)"
