            - code [ref=e7165]: "import numpy as np # 之前的MDS def classical_mds(D, d_prime=2, eps=1e-12): \"\"\" 经典 MDS（Classical MDS） 输入: D: (m, m) 距离矩阵，D[i, j] = dist(x_i, x_j)，要求对称、对角为0 d_prime: 目标降维维度 d' eps: 数值稳定用的小阈值 输出: Z: (m, d') 低维坐标矩阵，每一行是一个样本在低维空间的坐标 eigvals: 选取的前 d' 个特征值（从大到小） \"\"\" D = np.asarray(D, dtype=float) m = D.shape[0] assert D.shape == (m, m), \"D 必须是方阵 (m, m)\" D2 = D ** 2 I = np.eye(m) one = np.ones((m, 1)) J = I - (one @ one.T) / m B = -0.5 * J @ D2 @ J eigvals, eigvecs = np.linalg.eigh(B) idx = np.argsort(eigvals)[::-1] eigvals = eigvals[idx] eigvecs = eigvecs[:, idx] eigvals_top = eigvals[:d_prime] eigvecs_top = eigvecs[:, :d_prime] eigvals_top_clipped = np.maximum(eigvals_top, 0.0) Z = eigvecs_top * np.sqrt(eigvals_top_clipped + eps) return Z, eigvals_top # ========================= # 工具：两两欧氏距离矩阵 # ========================= def pairwise_dist(X): \"\"\"输入 X:(m,d)，输出 D:(m,m) 欧氏距离矩阵\"\"\" X = np.asarray(X, dtype=float) G = X @ X.T sq = np.diag(G) D2 = sq[:, None] + sq[None, :] - 2.0 * G D2 = np.maximum(D2, 0.0) return np.sqrt(D2) # ========================= # 1) KPCA（核PCA） # ========================= def kpca(X, d_prime=2, kernel=\"rbf\", gamma=None, degree=3, coef0=1.0, eps=1e-12): \"\"\" KPCA（Kernel PCA） 输入: X: (m,d) 样本矩阵（行=样本） d_prime: 目标维度 kernel: \"rbf\" | \"poly\" | \"linear\" gamma: RBF/poly 的系数；None 时默认 1/d degree, coef0: poly 核参数 eps: 数值稳定 输出: Z: (m,d') 训练样本的低维坐标 model: dict，用于对新样本做投影（包含 X_train、alpha、eigvals、核参数等） \"\"\" X = np.asarray(X, dtype=float) m, d = X.shape if gamma is None: gamma = 1.0 / max(d, 1) # 1) 构造核矩阵 K if kernel == \"linear\": K = X @ X.T elif kernel == \"poly\": K = (gamma * (X @ X.T) + coef0) ** degree elif kernel == \"rbf\": D = pairwise_dist(X) K = np.exp(-(gamma * (D ** 2))) else: raise ValueError(\"kernel 仅支持: 'rbf' | 'poly' | 'linear'\") # 2) 中心化核矩阵：Kc = J K J one = np.ones((m, 1)) J = np.eye(m) - (one @ one.T) / m Kc = J @ K @ J # 3) 特征分解（对称） eigvals, eigvecs = np.linalg.eigh(Kc) idx = np.argsort(eigvals)[::-1] eigvals, eigvecs = eigvals[idx], eigvecs[:, idx] # 4) 取前 d' 个（截断非正特征值） eigvals_top = eigvals[:d_prime] eigvecs_top = eigvecs[:, :d_prime] eigvals_top = np.maximum(eigvals_top, 0.0) # 5) 归一化 alpha：alpha_j = v_j / sqrt(lambda_j) # 这样新样本投影：z_j(x)=sum_i alpha_ij * k(x_i, x)（对应教材(10.25)） denom = np.sqrt(eigvals_top + eps) alpha = eigvecs_top / denom[None, :] # 6) 训练样本坐标：Z = Kc @ alpha Z = Kc @ alpha model = { \"X_train\": X, \"kernel\": kernel, \"gamma\": gamma, \"degree\": degree, \"coef0\": coef0, \"alpha\": alpha, # (m,d') \"eigvals\": eigvals_top, # (d',) \"K_row_mean\": K.mean(axis=1), # 用于中心化新样本核向量 \"K_all_mean\": K.mean(), # 用于中心化新样本核向量 } return Z, model def kpca_transform(X_new, model): \"\"\" KPCA 对新样本投影 输入: X_new: (n,d) 新样本 model: kpca 返回的 model 输出: Z_new: (n,d') 新样本低维坐标 \"\"\" X_new = np.asarray(X_new, dtype=float) Xtr = model[\"X_train\"] kernel = model[\"kernel\"] gamma = model[\"gamma\"] degree = model[\"degree\"] coef0 = model[\"coef0\"] alpha = model[\"alpha\"] # 1) 计算 K_new: (n,m) if kernel == \"linear\": K_new = X_new @ Xtr.T elif kernel == \"poly\": K_new = (gamma * (X_new @ Xtr.T) + coef0) ** degree elif kernel == \"rbf\": # 欧氏距离：||a-b||^2 = a^2 + b^2 -2ab A2 = np.sum(X_new**2, axis=1)[:, None] B2 = np.sum(Xtr**2, axis=1)[None, :] D2 = np.maximum(A2 + B2 - 2.0 * (X_new @ Xtr.T), 0.0) K_new = np.exp(-gamma * D2) else: raise ValueError(\"bad kernel\") # 2) 中心化新样本核向量（与训练时 Kc=J K J 一致） # k_c(x,·) = k(x,·) - mean_row(·) - mean(k(x,·)) + mean_all row_mean = model[\"K_row_mean\"][None, :] # (1,m) all_mean = model[\"K_all_mean\"] new_mean = K_new.mean(axis=1, keepdims=True) # (n,1) K_new_c = K_new - row_mean - new_mean + all_mean # 3) 投影：Z = K_new_c @ alpha return K_new_c @ alpha if __name__ == \"__main__\": rng = np.random.default_rng(0) X = rng.normal(size=(200, 5)) Z_kpca, model = kpca(X, d_prime=2, kernel=\"rbf\", gamma=0.5) print(Z_kpca.shape)"
