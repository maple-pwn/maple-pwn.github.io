          - paragraph [ref=e3634]: 默认采用偶校验，接收0x945=二进制1001 0100 0101，共12位，按题意编号从MSB到LSB递增，对应位置1到12分别为1 0 0 1 0 1 0 0 0 1 0 1。海明码校验位在位置1、2、4、8，分别检查“位置号二进制中对应位为1”的那些位置(包含该校验位本身)，用异或求偶校验综合：
          - paragraph [ref=e3635]: 对p1(位置1)覆盖1,3,5,7,9,11位：1⊕0⊕0⊕0⊕0⊕0=1，说明该组校验不满足，s1=1。
          - paragraph [ref=e3636]: 对p2(位置2)覆盖2,3,6,7,10,11位：0⊕0⊕1⊕0⊕1⊕0=0，满足，s2=0。
          - paragraph [ref=e3637]: 对p4(位置4)覆盖4,5,6,7,12位：1⊕0⊕1⊕0⊕1=1，不满足，s4=1。
          - paragraph [ref=e3638]: 对p8(位置8)覆盖8,9,10,11,12位：0⊕0⊕1⊕0⊕1=0，满足，s8=0。
          - paragraph [ref=e3639]: 综合s=s8s4s2s1=0101(二进制)=5，表示第5位出错，把第5位从0翻转为1，得到更正后的码字为1001 1100 0101=0x9C5。
          - paragraph [ref=e3640]: 取数据位(非1,2,4,8位)，按位置从小到大即3,5,6,7,9,10,11,12位依次为0 1 1 0 0 1 0 1，得到8位数据01100101=0x65。
          - generic [ref=e3641]:
            - paragraph [ref=e3642]: Tip
            - paragraph [ref=e3643]: 海明码
          - paragraph [ref=e3644]:
            - text: 笔记里没有这个，在这里做一下补充
            - strong [ref=e3645]: 先说它解决什么问题
            - text: 。海明码的目标是：在传输过程中如果只有 1 位出错，不仅能发现“错了”，还能准确知道“哪一位错了”，并把它改回来。这叫单错纠正，也就是常说的 SEC。
            - strong [ref=e3646]: 简单来说
            - text: ，不用一个校验位去管所有数据，而是用多个校验位，每个校验位负责“盯住”一部分比特。只要哪几组校验出了问题，就能唯一定位出错的位置。
          - paragraph [ref=e3647]: 第一步，先插“检查员”
          - list [ref=e3648]:
            - listitem [ref=e3649]: 假设你有 8 位数据，不是直接发出去，而是要插入若干校验位。校验位放在特殊的位置：编号是 1、2、4、8、16 这种 2 的幂的位置，其余位置才放数据。
            - listitem [ref=e3650]: 比如 8 位数据需要 4 个校验位，总共 12 位，那么第1、2、4、8位是校验位，第3、5、6、7、9、10、11、12位是数据位
            - listitem [ref=e3651]: 你可以把校验位想成“检查员”，每个检查员站在一个固定编号的位置上。
          - paragraph [ref=e3652]: 第二步，每个校验位负责检查谁
          - list [ref=e3653]:
            - listitem [ref=e3654]: 规则非常机械：
            - listitem [ref=e3655]: 把所有位编号写成二进制
            - listitem [ref=e3656]: 某个校验位只检查“编号的某一位是 1”的那些位置
            - listitem [ref=e3657]: 举个例子：
            - listitem [ref=e3658]: 1号校验位看编号二进制最低位是1的所有位置
            - listitem [ref=e3659]: 2号校验位看编号二进制第二位是1的位置
            - listitem [ref=e3660]: 4号校验位看第三位是1的位置
            - listitem [ref=e3661]: 8号校验位看第四位是1的位置
            - listitem [ref=e3662]: 理解成模或许会更明白（？
            - listitem [ref=e3663]: 它们各自把自己负责的那些位全部加起来，做“偶校验”（或者奇校验，看题目规定），然后设置自己的值，让总数满足规则。
          - paragraph [ref=e3664]: 第三步，接收时怎么判断有没有错
          - list [ref=e3665]:
            - listitem [ref=e3666]: 接收端什么都不用猜，重新做一遍刚才的检查
            - listitem [ref=e3667]: 如果所有校验位检查结果都“对”，那就说明没错。
            - listitem [ref=e3668]: 如果有校验位检查不通过，就把这些“出问题的校验位编号”记下来。
            - listitem [ref=e3669]: 关键点：把出问题的校验位编号按二进制拼起来，得到的那个数，就是出错的位置编号。
            - listitem [ref=e3670]: 比如：1号和4号校验位错了，二进制是 0101，十进制是 5，说明第5位出错
          - paragraph [ref=e3671]: 第四步，纠错
          - list [ref=e3672]:
            - listitem [ref=e3673]: 既然已经知道“第5位错了”，那只要把第5位 0 变 1，或者 1 变 0，就修好了。不需要重传，也不需要额外信息。
          - paragraph [ref=e3674]:
            - img "Pasted image 20260114231428.png" [ref=e3675]
            - text: 先改成RISCV： 改写后的 RISC-V 指令序列为
          - generic [ref=e3677]:
            - button "复制" [ref=e3678] [cursor=pointer]
            - code [ref=e3679]: "loop: add x6, x19, x19 add x6, x6, x6 add x6, x6, x22 lw x5, 0(x6) bne x5, x21, exit add x19, x19, x20 jal x0, loop exit:"
          - generic [ref=e3680]:
            - paragraph [ref=e3681]: Note
            - paragraph [ref=e3682]: 解析 不知道怎么讲了，直接看做题思路吧
          - paragraph [ref=e3683]:
            - strong [ref=e3684]: (1)
            - text: 第1条写 x6，第2条读 x6，属于第1条与第2条关于 x6 的 RAW 相关。
          - paragraph [ref=e3685]: 第2条写 x6，第3条读 x6，属于第2条与第3条关于 x6 的 RAW 相关。
          - paragraph [ref=e3686]: 第3条写 x6，第4条以 x6 为基址读内存，属于第3条与第4条关于 x6 的 RAW 相关。
          - paragraph [ref=e3687]: 第4条写 x5，第5条读 x5 进行比较，属于第4条与第5条关于 x5 的 RAW 相关。
          - paragraph [ref=e3688]: 第6条写 x19，而第1条和第6条之间不存在先后读写冲突，因为第1条在前一轮循环完成写回后，第6条才写 x19，不构成同一条流水线内的 RAW 冒险。
          - paragraph [ref=e3689]:
            - strong [ref=e3690]: (2)
          - paragraph [ref=e3691]: 第5条 bne 指令是否跳转会影响后续取指，产生控制相关。
          - paragraph [ref=e3692]: 第7条 jal 为无条件跳转，也会改变 PC，同样产生控制相关。
          - paragraph [ref=e3693]:
            - strong [ref=e3694]: (3)
          - paragraph [ref=e3695]: 在不采用转发的情况下，结果只能在 WB 阶段写回后，下一条指令在 ID 阶段后半拍才能读到，因此每一对紧邻的 RAW 相关至少需要插入 2 条 nop。
          - paragraph [ref=e3696]: 第1与第2条之间需插入2条 nop。
          - paragraph [ref=e3697]: 第2与第3条之间需插入2条 nop。
          - paragraph [ref=e3698]: 第3与第4条之间需插入2条 nop。
          - paragraph [ref=e3699]: 第4与第5条之间需插入2条 nop。
          - paragraph [ref=e3700]: 这些 nop 均插在前一条指令之后。
          - paragraph [ref=e3701]:
            - strong [ref=e3702]: (4)
            - text: 采用 EX/MEM、MEM/WB 转发后，第1、2、3条算术指令之间的相关都可以通过转发完全消除，不需要 nop。
          - paragraph [ref=e3703]: 第3条 add 与第4条 lw 之间，x6 可从 EX 阶段转发到 EX 阶段地址计算，也无需 nop。
          - paragraph [ref=e3704]: 第4条 lw 与第5条 bne 之间属于典型的 load-use 冒险，lw 的数据直到 MEM 阶段结束才可用，即使转发也无法在下一条指令的 EX 阶段使用，因此仍需在第4条之后插入 1 条 nop 才能消除数据冒险。
          - paragraph [ref=e3705]:
            - strong [ref=e3706]: (5)
          - paragraph [ref=e3707]: 若分支是否为零以及 PC 更新在 MEM 阶段完成，则在 bne 之后，已经进入流水线的 IF、ID、EX 三个阶段的指令都可能错误，需要插入 3 条 nop，位置在第5条之后。
          - paragraph [ref=e3708]: 若分支判断与 PC 更新在 EX 阶段完成，则只会错误取到 IF、ID 两级的指令，需要插入 2 条 nop，位置同样在第5条之后。
          - paragraph [ref=e3709]:
            - strong [ref=e3710]: (6)
          - paragraph [ref=e3711]: 若更新 PC 的操作在 EX 阶段完成，则在 jal 之后，IF 和 ID 两级的指令无效，需要阻塞 2 个时钟周期。
          - paragraph [ref=e3712]: 若更新 PC 的操作提前到 ID 阶段完成，则只有 IF 阶段取到的一条指令无效，流水线只需阻塞 1 个时钟周期。
