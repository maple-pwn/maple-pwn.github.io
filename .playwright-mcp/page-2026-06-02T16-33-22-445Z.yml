        - article [ref=e598]:
          - heading "部分试卷&重点题目分析" [level=1] [ref=e599]
          - generic [ref=e600]:
            - generic [ref=e601]: 阅读时长 47 分钟
            - generic [ref=e602]: 字数 14074
          - heading "一些试卷的解析" [level=2] [ref=e603]
          - heading "20-21 HY B" [level=3] [ref=e604]
          - paragraph [ref=e605]:
            - img "Pasted image 20260114185621.png" [ref=e606]
          - generic [ref=e607]:
            - paragraph [ref=e608]: Note
            - paragraph [ref=e609]: 解析
          - paragraph [ref=e610]: 采用 8 位带符号补码计算 (-111)+(-34)。
          - paragraph [ref=e611]: 先将 -111 转换为补码。111 的二进制为 0110 1111，按补码规则取反加一得到 1001 0001，因此 -111 的 8 位补码是 1001 0001。
          - paragraph [ref=e612]: 再将 -34 转换为补码。34 的二进制为 0010 0010，取反加一得到 1101 1110，因此 -34 的 8 位补码是 1101 1110。
          - paragraph [ref=e613]: 进行补码加法：1001 0001 + 1101 1110 = 1 0110 1111，丢弃最高位进位后结果为 0110 1111。
          - paragraph [ref=e614]: 判断溢出。两个加数符号位均为 1，结果符号位为 0，负数加负数却得到正数，发生溢出。
          - paragraph [ref=e615]:
            - text: 因此运算结果为 0110 1111，且有溢出，
            - strong [ref=e616]: 正确选项为 A。
          - paragraph [ref=e617]:
            - img "Pasted image 20260114190015.png" [ref=e618]
          - generic [ref=e619]:
            - paragraph [ref=e620]: Note
            - paragraph [ref=e621]: 解析 0x10-0x24=-0x14=-20，然后由于b型指令的偏移计算是imm*2，所以填入的立即数是-10，换算为十六进制应该是0xFF6
          - paragraph [ref=e622]:
            - img "Pasted image 20260114190055.png" [ref=e623]
          - generic [ref=e624]:
            - paragraph [ref=e625]: Note
            - paragraph [ref=e626]:
              - text: 解析 jr 指令的语义是无条件跳转到寄存器中给出的地址。RISC-V 中没有 jr，但可以用 jalr 指令实现同样功能，因为 jalr 以寄存器加立即数作为跳转目标地址。
              - strong [ref=e627]: 正确选项为 B。
          - generic [ref=e628]:
            - paragraph [ref=e629]: Tip
            - paragraph [ref=e630]:
              - code [ref=e631]: reg
              - text: 一般代表寄存器，于是和寄存器有关的缩写大多带有
              - code [ref=e632]: r
              - text: ，可以凭借这个进行判断
          - paragraph [ref=e633]:
            - img "Pasted image 20260114190217.png" [ref=e634]
          - generic [ref=e635]:
            - paragraph [ref=e636]: Note
            - paragraph [ref=e637]: 解析 循环中分支行为为连续 9 次跳转，随后 1 次不跳转，模式周期为 10。
          - paragraph [ref=e638]: 1 位预测器在第一次状态稳定后，每遇到最后一次不跳转会预测错误一次，因此 10 次中错 1 次，准确率为 9/10 = 90%，但首次进入循环还会多错一次，长期平均为 8/10≈ 80%。
          - paragraph [ref=e639]:
            - text: 2 位预测器在稳定后，仅在状态翻转时错一次，每个周期只在那一次不跳转时错，10 次中错 1 次，准确率为 9/10 = 90%，
            - strong [ref=e640]: 对应选项为 B。
          - generic [ref=e641]:
            - paragraph [ref=e642]: Tip
            - paragraph [ref=e643]:
              - text: 相关考点
              - strong [ref=e644]: 以本题的循环为背景，分支行为模式可以抽象为：连续 9 次跳转，接着 1 次不跳转，然后再次重复这一过程。
              - text: 对于 1 位预测器，它只保存“上一次是否跳转”的结果。循环开始后，前 9 次分支都会是跳转，只要预测器进入“预测跳转”状态，就能一直预测正确。到第 10 次分支，实际结果是不跳转，但预测器仍然预测跳转，因此发生一次错误，同时预测器状态被改成“预测不跳转”。接下来重新进入循环时，第 1 次分支的真实结果又是跳转，但预测器仍然预测不跳转，于是再次预测错误，然后状态切回“预测跳转”。因此在一个完整循环周期内，1 位预测器通常会在循环结束和下一次循环开始各错一次。
          - paragraph [ref=e645]: 对于 2 位预测器，它通常用一个 2 位饱和计数器表示状态，比如强跳转、弱跳转、弱不跳转、强不跳转。只要处在“强跳转”或“弱跳转”状态，预测结果都是跳转。循环执行过程中，连续 9 次跳转会把预测器推到“强跳转”状态。到循环结束时出现一次不跳转，预测仍然是跳转，于是发生一次错误，但状态只会从“强跳转”退到“弱跳转”，预测方向并不会立刻翻转。下一次重新进入循环时，真实结果又是跳转，预测器仍预测跳转，因此不再出错，并很快回到“强跳转”状态。这样在每个循环周期内，2 位预测器只会在那一次不跳转时出错一次。
          - paragraph [ref=e646]:
            - img "Pasted image 20260114190648.png" [ref=e647]
          - paragraph [ref=e648]:
            - img "Pasted image 20260114190654.png" [ref=e649]
          - generic [ref=e650]:
            - paragraph [ref=e651]: Note
            - paragraph [ref=e652]:
              - text: 解析 在单周期 CPU 中，所有指令都必须在一个时钟周期内完成，所以时钟周期要足够长以覆盖“最慢指令”的组合逻辑延迟，时钟频率就由最慢指令决定。四个选项里通常最慢的是访存指令，且 load 一般比 store 更慢，因为 load 需要从存储器读出数据并回写寄存器，而 store 不需要回写寄存器，路径更短。因此由 ld 的执行时间决定。
              - strong [ref=e653]: 答案选 A。
          - paragraph [ref=e654]:
            - img "Pasted image 20260114190848.png" [ref=e655]
          - generic [ref=e656]:
            - paragraph [ref=e657]: Note
            - paragraph [ref=e658]: 解析 这是一条典型的无前递、无冒险检测的 5 级流水数据相关插入 NOP 问题。关键规则是寄存器在同一周期前半写、后半读，所以只要消费者指令的读寄存器阶段 ID 与生产者指令的写回阶段 WB 落在同一周期也可以读到新值；否则就必须把消费者的 ID 推迟到不早于生产者的 WB。
          - paragraph [ref=e659]: 先看相关链：x11 由第一条 addi 写回，x12 由第二条 ld 写回，第三条 add 同时读 x11 和 x12，所以它的 ID 必须不早于第二条 ld 的 WB。按正常不插空的时序，第三条 add 的 ID 会比 ld 的 WB 早两拍，因此至少要在 ld 与 add 之间插入 2 条 NOP，才能把 add 的 ID 推到与 ld 的 WB 同周期，从而在后半周期读到 x12，同时 x11 也早已写回满足。
          - paragraph [ref=e660]: 再看第五条 add 读 x13，而 x13 由第三条 add 写回。即使前面已经插了 2 条 NOP，第五条 add 的 ID 仍会比第三条 add 的 WB 早一拍，因此还需要在第四条与第五条之间再插入 1 条 NOP，把第五条 add 的 ID 推迟到与第三条 add 的 WB 同周期后半读到 x13。
          - paragraph [ref=e661]:
            - text: 因此最少需要插入 3 条 NOP，
            - strong [ref=e662]: 对应选项 B。
          - paragraph [ref=e663]:
            - img "Pasted image 20260114191213.png" [ref=e664]
          - generic [ref=e665]:
            - paragraph [ref=e666]: Note
            - paragraph [ref=e667]:
              - text: 解析 第七题：
              - strong [ref=e668]: C
          - list [ref=e669]:
            - listitem [ref=e670]: A:分支判定点更靠后、误预测清空的指令更多，因此这是成立
            - listitem [ref=e671]: B:典型例子就是 load-use 冒险，数据要到 MEM/WB 才产生，旁路也来不及，这是标准结论，正确。
            - listitem [ref=e672]: C:同B的解释
            - listitem [ref=e673]: D:静态调度可以减少数据冒险和控制冒险带来的停顿。
          - paragraph [ref=e674]:
            - text: 第八题：
            - strong [ref=e675]: D
          - list [ref=e676]:
            - listitem [ref=e677]: A:增加一级 cache 大小不一定降低不命中率，受工作集和访问特性影响
            - listitem [ref=e678]: B:直达没有被淘汰
            - listitem [ref=e679]: C:多级Cache通常采用不同的数据块大小
            - listitem [ref=e680]: D:笔记中的典型例子，计算机更希望你的算法可以一行行查找而不是一列列查找
          - paragraph [ref=e681]:
            - img "Pasted image 20260114191608.png" [ref=e682]
          - generic [ref=e683]:
            - paragraph [ref=e684]: Note
            - paragraph [ref=e685]: 解析 平均读时间约等于平均寻道时间加平均旋转等待时间加数据传输时间。
          - paragraph [ref=e686]:
            - text: 7200RPM 表示每分钟 7200 转，每秒 7200/60=120 转，所以一圈周期为 1/120 秒=0.008333 秒=8.333ms，
            - strong [ref=e687]: 平均旋转等待时间**取半圈为 4.167ms。**平均寻道时间**给定为 8ms。传输 512B，速率 4MB/s=4×1024×1024 B/s=4194304B/s，所以**传输时间**为 512/4194304 秒=0.000122 秒=0.122ms。**总时间**约为 8 + 4.167 + 0.122 = 12.289ms，约等于 12.29ms，**对应选项 B
