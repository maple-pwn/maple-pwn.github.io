            - code [ref=e5285]: "**算性能提升**：Cache 命中需要 1 周期，主存访问需要 100 周期。 不用 Cache 的总时间为 4352000 周期。 用 Cache 的总时间为 27648×1 + 15872×101 = 1630720。 提升了 2.67 倍。 ![Pasted image 20260115182907.png](../../images/Pasted%20image%2020260115182907.png) ![Pasted image 20260115182916.png](../../images/Pasted%20image%2020260115182916.png) !!! note 解析 **(1)**"
          - paragraph [ref=e5286]: "30位主存地址划分: ┌─────────────┬──────────────┬─────────────┐ │ 标记(Tag) │ 块号(Index) │ 偏移(Offset)│ ├─────────────┼──────────────┼─────────────┤ │ 14位 │ 9位 │ 7位 │ │ (29-16) │ (15-7) │ (6-0) │ └─────────────┴──────────────┴─────────────┘"
          - generic [ref=e5288]:
            - button "复制" [ref=e5289] [cursor=pointer]
            - code [ref=e5290]: "**(2)** 数据区 64KB 标记区：14位×512块=896B 有效位：1位×512块 总计 66496B ![Pasted image 20260115183258.png](../../images/Pasted%20image%2020260115183258.png) !!! note 解析 **(1)** 时间局部性是指最近被访问的数据很可能在短时间内再次被访问。 `x[i]` 和 `y[i]` 每次都不一样，不具有时间局部性。 空间局部性是指一个存储位置被访问，附近的位置很有可能被访问。 `x[i]` 和 `y[i]` 连续存放，空间局部性很强。 命中率推断：高。 **(2)** Cache： - **数据区容量**: 32 B - **主存块大小**: 16 B - **Cache 块数**: 32 B ÷ 16 B = **2 块** 数据类型： - **数组 x**: 8 个 float = 32 字节，存放在地址 0000 0040H 开始 - **数组 y**: 8 个 float = 32 字节，紧跟在 x 后 **主存块划分（块大小 16B）** **数组 x** (从 0x40 开始): - 块A: 0x00000040 - 0x0000004F (`x[0]~x[3]`) - 块B: 0x00000050 - 0x0000005F (`x[4]~x[7]`) **数组 y** (从 0x60 开始): - 块C: 0x00000060 - 0x0000006F (`y[0]~y[3]`) - 块D: 0x00000070 - 0x0000007F (`y[4]~y[7]`) **Cache 块号计算** **直接映射**：Cache 块号 = (地址 ÷ 块大小) mod Cache 块数 **块号计算**:"
          - paragraph [ref=e5291]: "块A: 地址0x40, 块号 = (0x40 ÷ 16) mod 2 = 4 mod 2 = 0 块B: 地址0x50, 块号 = (0x50 ÷ 16) mod 2 = 5 mod 2 = 1 块C: 地址0x60, 块号 = (0x60 ÷ 16) mod 2 = 6 mod 2 = 0 块D: 地址0x70, 块号 = (0x70 ÷ 16) mod 2 = 7 mod 2 = 1"
