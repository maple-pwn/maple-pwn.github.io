              - text: cache 总大小 4KB，也就是 4096 字节，块大小 64 字节，所以 cache 一共有 4096 / 64 = 64 个块；double 是 8 字节，一个块里能放 64 / 8 = 8 个 double，采用直接映射；cache 初始为空，系统里没有其他程序干扰
          - paragraph [ref=e1861]:
            - text: 代码结构的关键点在于：外层循环跑很多次，但内层每一轮访问数组的方式完全一样。
            - strong [ref=e1862]: 所以性能好坏，取决于“上一轮访问过的数据，下一轮还能不能继续用”
          - paragraph [ref=e1863]:
            - strong [ref=e1864]: (1) STRIDE = 1，LEN 从 512 变成 1024，为什么性能明显下降
          - paragraph [ref=e1865]:
            - strong [ref=e1866]: 当 LEN = 512
            - text: ，数组大小是 512 × 8 = 4096 字节，正好等于 cache 大小，内层循环第一次完整扫一遍数组时，会把数组对应的 64 个内存块依次放进 cache，由于 cache 正好能装下这 64 个块，它们不会被挤出去，下一次、再下一次外层循环，访问的还是同一批数组元素，这些数据已经在 cache 里，不需要再从内存读，因此除了最开始那一轮比较慢，后面的 1023 轮都很快，整体性能很好**当 LEN = 1024**，数组大小是 1024 × 8 = 8192 字节，是 cache 大小的两倍，内层循环一轮会访问 128 个不同的内存块，cache 只有 64 个块位置，前面装进去的 64 个块，会在后半段访问时被后来的 64 个块替换掉，等下一轮外层循环再次从 array[0] 开始访问时，前半部分的数据已经不在 cache 里了，又要重新从内存读，**结果就是：每一轮内层循环，几乎都要重新读一遍数据**所以，相比 LEN = 512 的情况，慢得多，所以性能明显下降
          - paragraph [ref=e1867]:
            - strong [ref=e1868]: (2)在第 (1) 问条件下，改成全相联 + LRU，性能会不会提升
          - paragraph [ref=e1869]: 不会有本质提升,原因是：问题的根本不在“映射方式”，而在“数据总量太大” ,LEN = 1024 时，一轮需要用到 128 个块，但 cache 只能放 64 个，不管是直接映射还是全相联，都不可能同时保存下一轮还要用到的全部数据，因此每一轮还是要反复从内存加载，性能不会明显改善
          - paragraph [ref=e1870]:
            - strong [ref=e1871]: (3) STRIDE = 16，LEN = 512 时，cache 利用情况如何；LEN 变成 1024 会发生什么
          - paragraph [ref=e1872]:
            - text: STRIDE = 16 表示：每次访问
            - code [ref=e1873]: array[j]
            - text: ，下次访问
            - code [ref=e1874]: array[j+16]
            - text: ",16 个 double 是 128 字节，相当于每次跨过 2 个块,也就是说，"
            - strong [ref=e1875]: 每访问一次，就跳到一个新的块，而且在这个块里只用到 1 个 double
            - strong [ref=e1876]: LEN = 512 时
            - text: ：内层循环一共访问 512 / 16 = 32 次，对应 32 个不同的块，cache 有 64 个块位置，这 32 个块都能放进去，而且不会互相顶掉，所以从第二轮外层循环开始，这 32 个块都还能直接用，从“块是否被用到”的角度看，只用了 64 个块里的一半，也就是 50%，从“块内部是否被充分用到”的角度看，每个块 8 个 double 只用了 1 个，利用率是 ⅛**LEN = 1024 时**：内层循环访问 1024 / 16 = 64 次，对应 64 个不同的块，数量刚好等于 cache 块数，但由于是直接映射，这 64 个块中有一半会映射到同样的位置，结果是：后访问的块会把先访问的块替换掉，下一轮再访问先前的数据时，又要重新加载，因此程序会频繁地把数据装进 cache、又很快被替换掉，性能明显变差，此时从“块位置占用”来看，仍然主要只用到了其中一半的位置，但每次访问都要重新加载
          - paragraph [ref=e1877]:
            - strong [ref=e1878]: (4) 在第 (3) 问前提下，改成全相联 + LRU，性能会不会提升
          - paragraph [ref=e1879]: 会，而且在 LEN = 1024 时提升非常明显，因为 STRIDE = 16、LEN = 1024 的情况下，一轮内层循环正好访问 64 个不同的块，cache 也正好能放下 64 个块，如果不再强制固定映射位置，这 64 个块就可以同时留在 cache 里，这样第一轮把它们装进去后，后续外层循环都可以直接使用，不再反复从内存加载，所以相比直接映射，执行速度会有明显改善
