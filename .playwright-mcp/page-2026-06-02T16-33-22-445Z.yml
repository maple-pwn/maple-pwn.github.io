            - code [ref=e5247]: "tag：0000 0010 组号：010 块内地址：000001100 所以流程如下 1. 根据地址中间3位找到Cache第2组 2. 将标记位与Cache第2组两个Cache行标记位同时比较 3. 如果有一个相等并且有效位为1，则命中。此时根据低9位的块内地址从对应行中取出单元内容送CPU 4. 若不相等或相等但有效位为0，则为命中，此时将主存的第0000 0010 010块复制到第2组的任意空行，并置有效位为1 ![Pasted image 20260115180937.png](../../images/Pasted%20image%2020260115180937.png) !!! note 解析 Cache 总容量 4096 字；每块 64 字；共 64 块；16 组。 主存总容量 32K 字；每块 64 字；共 512 块。 主存地址需要 $2^{15}=32K \\Rightarrow 15$ 位。块内地址 6 位，组号 4 位，则标记位 5 位。 **访问序列 0, 1, 2, ..., 4351**，这里会涉及到 $4351/64=67.98$，即 68 个块。 4 路组相联映射，则 **组号 = 块号 mod 16**，块数统计："
          - paragraph [ref=e5248]: "组0: 块0, 16, 32, 48, 64 → 5个块 组1: 块1, 17, 33, 49, 65 → 5个块 组2: 块2, 18, 34, 50, 66 → 5个块 组3: 块3, 19, 35, 51, 67 → 5个块 组4: 块4, 20, 36, 52 → 4个块 组5: 块5, 21, 37, 53 → 4个块 ... 组15: 块15, 31, 47, 63 → 4个块"
          - generic [ref=e5250]:
            - button "复制" [ref=e5251] [cursor=pointer]
            - code [ref=e5252]: "**对于第一次访问：** 0~3 组 5 次访问，填入 5 次块，由于每组最多 4 块，所以会产生 5 次 MISS，即 20 次块 MISS，对应 **1280 次字 MISS**。 4~15 组 4 次访问，填入 4 次块，每组最多 4 块，所以只有初次填入时会产生 MISS，48 次块 MISS = **3072 次字 MISS**。 总计 4352 次字 MISS，全部 MISS，命中率为 0。 **对于后九次访问：** 0~3 组：每次都会按照 1、2、3、4 的顺序顶掉一个块，刚好全都是需要的，所以总共产生 4×5×9 = 180 次块 MISS。 4~15 组：不存在顶掉情况，全部命中。 总计 180 次块 MISS，即 11520 次字 MISS，总访问次数为 4352×9 = 39168 次，字命中次数为 39168 - 11520 = 27648 次。 **总体性能分析**：10 次完整访问统计如下"
