  <text x="840" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#165465">Audit and Governance</text>
  <text x="840" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#165465">trace / SIEM / IAM / DLP / KMS</text>
  <text x="840" y="586" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#165465">alerts / forensics / policy versioning</text>

