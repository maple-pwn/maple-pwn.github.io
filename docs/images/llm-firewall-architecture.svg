  <text x="1065" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#155635">Tools</text>
  <text x="1065" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#155635">email / browser / db / MCP</text>

  <rect x="930" y="278" width="270" height="112" rx="20" fill="#ffe9d7" stroke="#c46e1f" stroke-width="3"/>
  <text x="1065" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#7a3f06">RAG / Memory</text>
  <text x="1065" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#7a3f06">retrieval / cache / long-term state</text>

  <rect x="300" y="480" width="280" height="150" rx="22" fill="#fff1f6" stroke="#c24d80" stroke-width="3"/>
