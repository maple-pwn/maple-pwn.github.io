  <text x="150" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#6e221b">External Data</text>
  <text x="150" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6e221b">web / docs / email</text>

