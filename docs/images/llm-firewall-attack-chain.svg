<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <rect width="1280" height="760" fill="#fbfaf7"/>
  <text x="60" y="62" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1b2733">Prompt Injection Attack Paths</text>
  <text x="60" y="96" font-family="Arial, sans-serif" font-size="18" fill="#536170">Direct injection arrives from the user; indirect injection hides in external content and tool outputs.</text>

  <line x1="640" y1="130" x2="640" y2="690" stroke="#d6d0c6" stroke-width="4" stroke-dasharray="10 10"/>
  <text x="240" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7f2d2d">Direct Injection</text>
  <text x="960" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7a4a00">Indirect Injection</text>

  <rect x="90" y="190" width="250" height="86" rx="18" fill="#ffe7e7" stroke="#b84f4f" stroke-width="2"/>
  <text x="215" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7d1b1b">User Message</text>
  <text x="215" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#7d1b1b">"Ignore prior rules..."</text>

  <rect x="90" y="330" width="250" height="100" rx="18" fill="#fff5d6" stroke="#b28b16" stroke-width="2"/>
  <text x="215" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#6f5406">Context Assembly</text>
  <text x="215" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#6f5406">system + developer + user</text>

  <rect x="90" y="484" width="250" height="100" rx="18" fill="#e7efff" stroke="#4c68c9" stroke-width="2"/>
  <text x="215" y="524" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1b3480">Model / Agent</text>
  <text x="215" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1b3480">policy override attempt</text>

  <rect x="90" y="620" width="250" height="78" rx="18" fill="#fde8f3" stroke="#c1568f" stroke-width="2"/>
  <text x="215" y="666" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#7b214d">Leak / Unsafe Output</text>

  <rect x="760" y="180" width="320" height="94" rx="18" fill="#ffe9d8" stroke="#c4701f" stroke-width="2"/>
  <text x="920" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7a4106">Untrusted Source</text>
  <text x="920" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#7a4106">web / doc / email / tool response</text>

  <rect x="760" y="320" width="320" height="104" rx="18" fill="#fff5d6" stroke="#b28b16" stroke-width="2"/>
  <text x="920" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#6f5406">Retriever / Tool Layer</text>
  <text x="920" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#6f5406">malicious text enters context</text>

  <rect x="760" y="474" width="320" height="104" rx="18" fill="#e7efff" stroke="#4c68c9" stroke-width="2"/>
  <text x="920" y="516" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1b3480">Model / Agent</text>
  <text x="920" y="546" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1b3480">treats data as instructions</text>

  <rect x="760" y="620" width="320" height="78" rx="18" fill="#e7f8ec" stroke="#328357" stroke-width="2"/>
  <text x="920" y="666" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#145235">Tool Abuse / Data Exfiltration</text>

  <rect x="420" y="260" width="160" height="360" rx="24" fill="#eef6ff" stroke="#4972a5" stroke-width="3"/>
  <text x="500" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1b4d7d">LLM</text>
  <text x="500" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1b4d7d">Firewall</text>
  <rect x="445" y="382" width="110" height="56" rx="12" fill="#ffffff" stroke="#8fb3de"/>
  <text x="500" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#29557a">detect</text>
  <rect x="445" y="456" width="110" height="56" rx="12" fill="#ffffff" stroke="#8fb3de"/>
  <text x="500" y="491" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#29557a">tier</text>
  <rect x="445" y="530" width="110" height="56" rx="12" fill="#ffffff" stroke="#8fb3de"/>
  <text x="500" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#29557a">block / gate</text>

  <path d="M340 233 H420" stroke="#a33a3a" stroke-width="4" fill="none"/>
  <polygon points="420,233 406,226 406,240" fill="#a33a3a"/>
  <path d="M340 380 H420" stroke="#96740f" stroke-width="4" fill="none"/>
  <polygon points="420,380 406,373 406,387" fill="#96740f"/>
  <path d="M340 534 H420" stroke="#3452b7" stroke-width="4" fill="none"/>
  <polygon points="420,534 406,527 406,541" fill="#3452b7"/>

  <path d="M760 227 H580" stroke="#aa6a1d" stroke-width="4" fill="none"/>
  <polygon points="580,227 594,220 594,234" fill="#aa6a1d"/>
  <path d="M760 372 H580" stroke="#96740f" stroke-width="4" fill="none"/>
  <polygon points="580,372 594,365 594,379" fill="#96740f"/>
  <path d="M760 526 H580" stroke="#3452b7" stroke-width="4" fill="none"/>
  <polygon points="580,526 594,519 594,533" fill="#3452b7"/>

  <text x="60" y="730" font-family="Arial, sans-serif" font-size="17" fill="#5a6773">Author-drawn summary based on OWASP LLM01, NIST prompt injection terminology, Greshake et al. (2023), and Microsoft BIPIA / Prompt Shields material.</text>
</svg>
