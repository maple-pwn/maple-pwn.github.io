<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>32位位运算可视化工具</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #102a43;
      --muted: #627d98;
      --line: #d9e2ec;
      --one: #2f855a;
      --zero: #cbd5e0;
      --accent: #1f6feb;
      --soft: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(140deg, #f4f6f8, #eef2f7);
      color: var(--text);
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 8px 20px rgba(16, 42, 67, 0.06);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 22px;
    }
    .desc {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    .controls {
      display: grid;
      grid-template-columns: 1.25fr 1fr 1.25fr 0.9fr 0.8fr;
      gap: 12px;
      align-items: end;
    }
    .panel-title {
      margin: 0 0 10px;
      font-size: 16px;
    }
    .panel-note {
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--muted);
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input, select, button {
      width: 100%;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
    }
    button {
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 600;
    }
    button:hover { filter: brightness(0.96); }
    .stack {
      display: grid;
      gap: 12px;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      background: var(--soft);
    }
    .panel h3 {
      margin: 0 0 8px;
      font-size: 14px;
      color: var(--muted);
      font-weight: 700;
    }
    .bits {
      overflow-x: auto;
      padding-bottom: 6px;
    }
    .bit-row {
      display: grid;
      grid-template-columns: 72px repeat(32, 24px);
      gap: 4px;
      align-items: center;
      margin-bottom: 6px;
      min-width: 920px;
    }
    .bit-row .name {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }
    .bit-row .cell {
      height: 24px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      border: 1px solid var(--line);
      user-select: none;
    }
    .bit-row .one {
      background: rgba(47, 133, 90, 0.18);
      color: var(--one);
      border-color: rgba(47, 133, 90, 0.35);
    }
    .bit-row .zero {
      background: #f8fafc;
      color: #7b8794;
    }
    .index-row .cell {
      font-size: 10px;
      color: #7b8794;
      background: #f8fafc;
    }
    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 10px;
      font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
      font-size: 13px;
    }
    .meta-item {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      line-height: 1.45;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .editable .cell {
      cursor: pointer;
      transition: transform 0.08s ease;
    }
    .editable .cell:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }
    .error {
      color: #c53030;
      font-size: 13px;
      margin-top: 10px;
      min-height: 18px;
    }
    @media (max-width: 980px) {
      .controls {
        grid-template-columns: repeat(2, minmax(160px, 1fr));
      }
    }
    @media (max-width: 680px) {
      body { padding: 14px 10px; }
      .card { padding: 12px; }
      h1 { font-size: 19px; }
      .controls { grid-template-columns: 1fr; }
      .bit-row {
        grid-template-columns: 64px repeat(32, 20px);
        min-width: 760px;
        gap: 3px;
      }
      .bit-row .cell {
        height: 20px;
        font-size: 11px;
      }
      .meta {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <h1>32位位运算可视化工具</h1>
      <p class="desc">输入支持十进制（如 -5）、十六进制（如 0xFF）、二进制（如 0b1010）。结果按无符号32位展示。</p>
    </section>

    <section class="card">
      <h2 class="panel-title">参数输入</h2>
      <p class="panel-note">支持十进制（如 -5）、十六进制（如 0xFF）、二进制（如 0b1010）。</p>
      <div class="controls">
        <div>
          <label for="inputA">A</label>
          <input id="inputA" value="0xF0F0F0F0" />
        </div>
        <div>
          <label for="op">运算</label>
          <select id="op">
            <option value="and">A &amp; B</option>
            <option value="or">A | B</option>
            <option value="xor">A ^ B</option>
            <option value="add">A + B</option>
            <option value="sub">A - B</option>
            <option value="mul">A * B</option>
            <option value="div">A / B</option>
            <option value="not">~A</option>
            <option value="lshift">A &lt;&lt; n</option>
            <option value="rshift">A &gt;&gt; n</option>
            <option value="urshift">A &gt;&gt;&gt; n</option>
          </select>
        </div>
        <div id="groupB">
          <label for="inputB">B</label>
          <input id="inputB" value="0x0F0F0F0F" />
        </div>
        <div id="groupN" style="display:none;">
          <label for="shiftN">n (0-31)</label>
          <input id="shiftN" type="number" min="0" max="31" value="4" />
        </div>
        <div>
          <button id="calcBtn">计算</button>
        </div>
      </div>
      <div class="error" id="err"></div>
    </section>

    <section class="card bits">
      <div class="stack">
        <div class="panel">
          <h3>手动位编辑（点击切换 0/1，bit31 在最左）</h3>
          <div id="editorContainer"></div>
        </div>
        <div class="panel">
          <h3>位图结果</h3>
          <div id="bitContainer"></div>
        </div>
        <div class="panel">
          <h3>数值明细</h3>
          <div class="meta" id="metaContainer"></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    function parseNum(str) {
      const s = String(str).trim().toLowerCase();
      if (!s) throw new Error("请输入数字");
      let n;
      if (/^-?0x[0-9a-f]+$/.test(s)) {
        n = Number.parseInt(s, 16);
      } else if (/^-?0b[01]+$/.test(s)) {
        const sign = s.startsWith("-") ? -1 : 1;
        const body = s.replace("-", "").slice(2);
        n = sign * Number.parseInt(body, 2);
      } else if (/^-?\d+$/.test(s)) {
        n = Number.parseInt(s, 10);
      } else {
        throw new Error("格式错误，只支持十进制/0x十六进制/0b二进制");
      }
      if (!Number.isFinite(n)) throw new Error("数值无效");
      return n >>> 0;
    }

    function toBits32(u32) {
      return (u32 >>> 0).toString(2).padStart(32, "0");
    }

    function groupBits(bits) {
      return bits.replace(/(.{4})/g, "$1 ").trim();
    }

    function toHex(u32) {
      return "0x" + (u32 >>> 0).toString(16).toUpperCase().padStart(8, "0");
    }

    function toSigned(u32) {
      return (u32 >> 0);
    }

    function makeRow(name, bits, extraClass) {
      const row = document.createElement("div");
      row.className = "bit-row" + (extraClass ? " " + extraClass : "");
      const nameCell = document.createElement("div");
      nameCell.className = "name";
      nameCell.textContent = name;
      row.appendChild(nameCell);
      for (let i = 0; i < bits.length; i++) {
        const c = document.createElement("div");
        const bit = bits[i];
        c.className = "cell " + (bit === "1" ? "one" : "zero");
        c.textContent = bit;
        row.appendChild(c);
      }
      return row;
    }

    function bitsToU32(bits) {
      return Number.parseInt(bits, 2) >>> 0;
    }

    function makeEditableRow(name, bits, onToggle, hidden) {
      const row = makeRow(name, bits, "editable");
      if (hidden) row.style.display = "none";
      const cells = row.querySelectorAll(".cell");
      for (let i = 0; i < bits.length; i++) {
        cells[i].addEventListener("click", () => {
          const nextBit = bits[i] === "1" ? "0" : "1";
          const nextBits = bits.slice(0, i) + nextBit + bits.slice(i + 1);
          onToggle(nextBits);
        });
      }
      return row;
    }

    function makeIndexRow() {
      const row = document.createElement("div");
      row.className = "bit-row index-row";
      const nameCell = document.createElement("div");
      nameCell.className = "name";
      nameCell.textContent = "bit位";
      row.appendChild(nameCell);
      for (let i = 31; i >= 0; i--) {
        const c = document.createElement("div");
        c.className = "cell";
        c.textContent = i;
        row.appendChild(c);
      }
      return row;
    }

    function makeMeta(title, u32) {
      const bits = toBits32(u32);
      return [
        title + " (unsigned): " + (u32 >>> 0),
        title + " (signed): " + toSigned(u32),
        title + " (hex): " + toHex(u32),
        title + " (bin): " + groupBits(bits)
      ];
    }

    function render() {
      const errEl = document.getElementById("err");
      const editor = document.getElementById("editorContainer");
      const container = document.getElementById("bitContainer");
      const meta = document.getElementById("metaContainer");
      errEl.textContent = "";
      editor.innerHTML = "";
      container.innerHTML = "";
      meta.innerHTML = "";
      try {
        const op = document.getElementById("op").value;
        const inputAEl = document.getElementById("inputA");
        const inputBEl = document.getElementById("inputB");
        const a = parseNum(inputAEl.value);
        const aBits = toBits32(a);
        let b = 0;
        let r = 0;
        let bBits = "";
        let opText = "";
        const useB = (
          op === "and" || op === "or" || op === "xor" ||
          op === "add" || op === "sub" || op === "mul" || op === "div"
        );
        let bForEditor = 0;
        try {
          bForEditor = parseNum(inputBEl.value);
        } catch (e) {
          if (useB) throw e;
        }
        const bEditorBits = toBits32(bForEditor);

        editor.appendChild(makeIndexRow());
        editor.appendChild(makeEditableRow("编辑A", aBits, (nextBits) => {
          inputAEl.value = toHex(bitsToU32(nextBits));
          render();
        }, false));
        editor.appendChild(makeEditableRow("编辑B", bEditorBits, (nextBits) => {
          inputBEl.value = toHex(bitsToU32(nextBits));
          render();
        }, !useB));

        if (op === "not") {
          r = (~a) >>> 0;
          opText = "~A";
        } else if (op === "lshift" || op === "rshift" || op === "urshift") {
          const nRaw = Number.parseInt(document.getElementById("shiftN").value, 10);
          const n = Number.isFinite(nRaw) ? (nRaw & 31) : 0;
          if (op === "lshift") {
            r = (a << n) >>> 0;
            opText = "A << " + n;
          } else if (op === "rshift") {
            r = (a >> n) >>> 0;
            opText = "A >> " + n;
          } else {
            r = a >>> n;
            opText = "A >>> " + n;
          }
        } else {
          b = bForEditor;
          bBits = toBits32(b);
          if (op === "and") {
            r = (a & b) >>> 0;
            opText = "A & B";
          } else if (op === "or") {
            r = (a | b) >>> 0;
            opText = "A | B";
          } else if (op === "xor") {
            r = (a ^ b) >>> 0;
            opText = "A ^ B";
          } else if (op === "add") {
            r = (a + b) >>> 0;
            opText = "A + B (mod 2^32)";
          } else if (op === "sub") {
            r = (a - b) >>> 0;
            opText = "A - B (mod 2^32)";
          } else if (op === "mul") {
            r = Math.imul(a, b) >>> 0;
            opText = "A * B (low 32 bits)";
          } else {
            if (b === 0) throw new Error("除数 B 不能为 0");
            const sa = toSigned(a);
            const sb = toSigned(b);
            const q = sb === 0 ? 0 : Math.trunc(sa / sb);
            r = (q | 0) >>> 0;
            opText = "A / B (int32 截断)";
          }
        }

        const rBits = toBits32(r);
        container.appendChild(makeIndexRow());
        container.appendChild(makeRow("A", aBits));
        if (bBits) container.appendChild(makeRow("B", bBits));
        container.appendChild(makeRow("结果", rBits));

        const allMeta = []
          .concat(makeMeta("A", a))
          .concat(bBits ? makeMeta("B", b) : [])
          .concat(["操作: " + opText])
          .concat(makeMeta("结果", r));

        allMeta.forEach(text => {
          const d = document.createElement("div");
          d.className = "meta-item";
          d.textContent = text;
          meta.appendChild(d);
        });
      } catch (e) {
        errEl.textContent = e.message || String(e);
      }
    }

    const opEl = document.getElementById("op");
    function updateMode() {
      const op = opEl.value;
      const showB = (
        op === "and" || op === "or" || op === "xor" ||
        op === "add" || op === "sub" || op === "mul" || op === "div"
      );
      const showN = (op === "lshift" || op === "rshift" || op === "urshift");
      document.getElementById("groupB").style.display = showB ? "block" : "none";
      document.getElementById("groupN").style.display = showN ? "block" : "none";
      render();
    }

    document.getElementById("calcBtn").addEventListener("click", render);
    document.getElementById("inputA").addEventListener("input", render);
    document.getElementById("inputB").addEventListener("input", render);
    document.getElementById("shiftN").addEventListener("input", render);
    opEl.addEventListener("change", updateMode);
    updateMode();
  </script>
</body>
</html>
