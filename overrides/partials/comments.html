{% if page.meta.comments != false %}
<div class="md-typeset" style="margin-top: 2rem;">
  {% if page and (page.previous_page or page.next_page) %}
    <nav class="post-nav" aria-label="文章分页导航">
      {% if page.previous_page %}
        <a class="post-nav__link post-nav__link--prev" href="{{ page.previous_page.url | url }}">
          <span class="post-nav__label">上一篇</span>
          <span class="post-nav__title">{{ page.previous_page.title }}</span>
        </a>
      {% endif %}
      {% if page.next_page %}
        <a class="post-nav__link post-nav__link--next" href="{{ page.next_page.url | url }}">
          <span class="post-nav__label">下一篇</span>
          <span class="post-nav__title">{{ page.next_page.title }}</span>
        </a>
      {% endif %}
    </nav>
  {% endif %}

  <h2 id="__comments">评论</h2>
  
  <script>
    var giscusTheme = document.body.getAttribute("data-md-color-scheme") === "slate" ? "dark_dimmed" : "light";
    
    var giscusScript = document.createElement("script");
    giscusScript.src = "https://giscus.app/client.js";
    giscusScript.setAttribute("data-repo", "maple-pwn/maple-pwn.github.io");
    giscusScript.setAttribute("data-repo-id", "R_kgDOP5uLTQ");
    giscusScript.setAttribute("data-category", "Comments");
    giscusScript.setAttribute("data-category-id", "DIC_kwDOP5uLTc4C130e");
    giscusScript.setAttribute("data-mapping", "pathname");
    giscusScript.setAttribute("data-strict", "0");
    giscusScript.setAttribute("data-reactions-enabled", "1");
    giscusScript.setAttribute("data-emit-metadata", "0");
    giscusScript.setAttribute("data-input-position", "bottom");
    giscusScript.setAttribute("data-theme", giscusTheme);
    giscusScript.setAttribute("data-lang", "zh-CN");
    giscusScript.setAttribute("data-loading", "lazy");
    giscusScript.setAttribute("crossorigin", "anonymous");
    giscusScript.async = true;
    
    document.getElementById("__comments").insertAdjacentElement("afterend", giscusScript);
    
    // Theme sync
    var observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.attributeName === "data-md-color-scheme") {
          var theme = document.body.getAttribute("data-md-color-scheme") === "slate" ? "dark_dimmed" : "light";
          var iframe = document.querySelector(".giscus-frame");
          if (iframe) {
            iframe.contentWindow.postMessage(
              { giscus: { setConfig: { theme: theme } } },
              "https://giscus.app"
            );
          }
        }
      });
    });
    observer.observe(document.body, { attributes: true });
  </script>
</div>
{% endif %}
